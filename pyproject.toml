[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-iclone8-ui-mcp"
version = "0.1.0"
description = "Local MCP server for verified iClone 8 UI automation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
screenshots = ["Pillow>=10"]

[project.scripts]
mc-iclone8-ui-mcp = "mc_iclone8_ui_mcp.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
